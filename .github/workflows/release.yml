name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: "linux;x86_64;x86_64-linux-gnu;tar.gz"
            artifact: "sa-linux-x86_64.tar.gz"
            llvm_include: "/usr/lib/llvm-14/include"
            llvm_lib: "/usr/lib/llvm-14/lib"
            llvm_name: "LLVM-14"
            allow_failure: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: "linux;aarch64;aarch64-linux-gnu;tar.gz"
            artifact: "sa-linux-aarch64.tar.gz"
            llvm_include: "/usr/lib/llvm-14/include"
            llvm_lib: "/usr/lib/llvm-14/lib"
            llvm_name: "LLVM-14"
            allow_failure: true
          # Non-Linux release archives stay disabled until the native macOS/Windows
          # workflows have recorded successful compiler, runtime, installer, and
          # archive smoke evidence for the matching target.
          # - name: macos-x86_64
          #   runner: macos-15-intel
          #   target: "macos;x86_64;x86_64-macos;tar.gz"
          #   artifact: "sa-macos-x86_64.tar.gz"
          #   llvm_include: "/usr/local/opt/llvm@14/include"
          #   llvm_lib: "/usr/local/opt/llvm@14/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
          # - name: macos-aarch64
          #   runner: macos-15
          #   target: "macos;aarch64;aarch64-macos;tar.gz"
          #   artifact: "sa-macos-aarch64.tar.gz"
          #   llvm_include: "/opt/homebrew/opt/llvm@14/include"
          #   llvm_lib: "/opt/homebrew/opt/llvm@14/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
          # - name: windows-x86_64
          #   runner: windows-2025
          #   target: "windows;x86_64;x86_64-windows-gnu;zip"
          #   artifact: "sa-windows-x86_64.zip"
          #   llvm_include: "C:/Program Files/LLVM/include"
          #   llvm_lib: "C:/Program Files/LLVM/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
          # - name: windows-aarch64
          #   runner: windows-11-arm
          #   target: "windows;aarch64;aarch64-windows-gnu;zip"
          #   artifact: "sa-windows-aarch64.zip"
          #   llvm_include: "C:/Program Files/LLVM/include"
          #   llvm_lib: "C:/Program Files/LLVM/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Set tag release version
        if: github.ref_type == 'tag'
        shell: bash
        run: printf 'SA_VERSION=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-${{ matrix.name }}-zig-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-zig-
            ${{ runner.os }}-zig-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip llvm-14-dev

      # Non-Linux dependency setup is disabled with the non-Linux matrix entries above.
      # - name: Install macOS packaging dependencies
      #   if: runner.os == 'macOS'
      #   run: brew install llvm@14
      #
      # - name: Install Windows packaging dependencies
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   run: choco install llvm zip -y

      - name: Build release archive
        env:
          SA_TARGETS: ${{ matrix.target }}
          LLVM_INCLUDE_DIR: ${{ matrix.llvm_include }}
          LLVM_LIB_DIR: ${{ matrix.llvm_lib }}
          LLVM_LIB_NAME: ${{ matrix.llvm_name }}
        shell: bash
        run: tools/release.sh

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/sha256sums.txt

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify sidecars and generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob

          archives=(sa-*.tar.gz sa-*.zip)
          sidecars=(sa-*.tar.gz.sha256 sa-*.zip.sha256)
          if (( ${#archives[@]} == 0 )); then
            echo "No release archives were downloaded" >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            sidecar="${archive}.sha256"
            if [[ ! -f "$sidecar" ]]; then
              echo "Missing checksum sidecar: $sidecar" >&2
              exit 1
            fi

            mapfile -t checksum_lines < "$sidecar"
            if (( ${#checksum_lines[@]} != 1 )); then
              echo "Checksum sidecar must contain exactly one line: $sidecar" >&2
              exit 1
            fi

            checksum_hash=""
            checksum_name=""
            checksum_extra=""
            read -r checksum_hash checksum_name checksum_extra <<< "${checksum_lines[0]}"
            if [[ ! "$checksum_hash" =~ ^[[:xdigit:]]{64}$ ]] ||
               [[ "$checksum_name" != "$archive" ]] ||
               [[ -n "$checksum_extra" ]]; then
              echo "Invalid checksum sidecar entry: $sidecar" >&2
              exit 1
            fi

            sha256sum --check --strict "$sidecar"
          done

          for sidecar in "${sidecars[@]}"; do
            archive="${sidecar%.sha256}"
            if [[ ! -f "$archive" ]]; then
              echo "Checksum sidecar has no matching archive: $sidecar" >&2
              exit 1
            fi
          done

          sha256sum -- "${archives[@]}" | LC_ALL=C sort -k2 > sha256sums.txt
          sha256sum --check --strict sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sa-*.tar.gz
            dist/sa-*.tar.gz.sha256
            dist/sa-*.zip
            dist/sa-*.zip.sha256
            dist/sha256sums.txt

name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: "linux;x86_64;x86_64-linux-gnu;tar.gz"
            artifact: "sa-linux-x86_64.tar.gz"
            llvm_include: "/usr/lib/llvm-14/include"
            llvm_lib: "/usr/lib/llvm-14/lib"
            llvm_name: "LLVM-14"
            allow_failure: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: "linux;aarch64;aarch64-linux-gnu;tar.gz"
            artifact: "sa-linux-aarch64.tar.gz"
            llvm_include: "/usr/lib/llvm-14/include"
            llvm_lib: "/usr/lib/llvm-14/lib"
            llvm_name: "LLVM-14"
            allow_failure: true
          - name: windows-x86_64-bootstrap
            runner: windows-2025
            target: "windows;x86_64;x86_64-windows-gnu;zip"
            artifact: "sa-windows-x86_64.zip"
            llvm_include: ""
            llvm_lib: ""
            llvm_name: "LLVM-C"
            allow_failure: false
          # Other non-Linux release archives remain disabled until their
          # runtime support levels and native CI gates are established.
          # - name: macos-x86_64
          #   runner: macos-15-intel
          #   target: "macos;x86_64;x86_64-macos;tar.gz"
          #   artifact: "sa-macos-x86_64.tar.gz"
          #   llvm_include: "/usr/local/opt/llvm@14/include"
          #   llvm_lib: "/usr/local/opt/llvm@14/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
          # - name: macos-aarch64
          #   runner: macos-15
          #   target: "macos;aarch64;aarch64-macos;tar.gz"
          #   artifact: "sa-macos-aarch64.tar.gz"
          #   llvm_include: "/opt/homebrew/opt/llvm@14/include"
          #   llvm_lib: "/opt/homebrew/opt/llvm@14/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
          # - name: windows-aarch64
          #   runner: windows-11-arm
          #   target: "windows;aarch64;aarch64-windows-gnu;zip"
          #   artifact: "sa-windows-aarch64.zip"
          #   llvm_include: "C:/Program Files/LLVM/include"
          #   llvm_lib: "C:/Program Files/LLVM/lib"
          #   llvm_name: "LLVM"
          #   allow_failure: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-${{ matrix.name }}-zig-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-zig-
            ${{ runner.os }}-zig-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip llvm-14-dev

      - name: Verify Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw "powershell.exe is required for ZIP packaging" }

      # Non-Linux dependency setup is disabled with the non-Linux matrix entries above.
      # - name: Install macOS packaging dependencies
      #   if: runner.os == 'macOS'
      #   run: brew install llvm@14
      #
      # - name: Install Windows packaging dependencies
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   run: choco install llvm zip -y

      - name: Build release archive
        env:
          SA_TARGETS: ${{ matrix.target }}
          LLVM_INCLUDE_DIR: ${{ matrix.llvm_include }}
          LLVM_LIB_DIR: ${{ matrix.llvm_lib }}
          LLVM_LIB_NAME: ${{ matrix.llvm_name }}
        shell: bash
        run: tools/release.sh

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}

  installer:
    name: Build SCI Windows installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    steps:
      - name: Checkout SCI
        uses: actions/checkout@v4
        with:
          path: sci
          fetch-depth: 0

      - name: Checkout SLA plugin
        uses: actions/checkout@v4
        with:
          repository: layola13/sa_plugin_sla
          ref: windows/support-windows-build
          path: sa_plugin_sla
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install LLVM 14
        shell: pwsh
        run: choco install llvm --version=14.0.6 --yes --no-progress

      - name: Build SCI and SLA Windows artifacts
        shell: pwsh
        working-directory: sci
        run: |
          $llvmInclude = 'C:\Program Files\LLVM\include'
          $llvmLib = 'C:\Program Files\LLVM\lib'
          zig build install -Dllvm=true -Dllvm-include-dir=$llvmInclude -Dllvm-lib-dir=$llvmLib -Dllvm-lib-name=LLVM-C
          Push-Location ..\sa_plugin_sla
          try {
            zig build install -Dtarget=x86_64-windows -Doptimize=ReleaseFast
          } finally {
            Pop-Location
          }

      - name: Build full Windows bundle
        shell: pwsh
        working-directory: sci
        run: .\tools\package_windows.ps1 -SkipBuild -Output 'dist/SCI-windows-x64-full.zip' -LlvmBin 'C:\Program Files\LLVM\bin' -TimeoutSeconds 900

      - name: Build Electron installer
        shell: pwsh
        working-directory: sci
        run: .\tools\build_electron_installer_windows.ps1 -SkipBundle -Output 'dist/SCI-windows-x64-full.zip' -TimeoutSeconds 900

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: sci/tools/electron-installer/dist/SCI-Setup-*.exe
          if-no-files-found: error
  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "*"

      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum sa-* SCI-Setup-*.exe > sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sa-*.tar.gz
            dist/sa-*.zip
            dist/SCI-Setup-*.exe
            dist/sha256sums.txt
